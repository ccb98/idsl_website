<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">Research themes of the Intelligent Digital Systems Lab</title>
  <desc id="d">A neural network feeds an FPGA chip, which connects to a camera view with object detection boxes and a drone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1f4d"/><stop offset="1" stop-color="#1b4fd6"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a67"/><stop offset="1" stop-color="#101a3a"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6ea8ff" stop-opacity=".55"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#bg)"/>
  <rect width="800" height="560" rx="24" fill="url(#grid)"/>
  <circle cx="400" cy="290" r="230" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#7fb0ff" stroke-opacity=".5" stroke-width="2">
    <path d="M300 250H210"/><path d="M300 290H210"/><path d="M300 330H210"/>
    <path d="M500 250H560L590 220H660"/><path d="M500 330H560L590 360H660"/>
    <path d="M400 190V130H520"/><path d="M400 390V450H300"/>
  </g>

  <!-- neural network (left) -->
  <g>
    <g stroke="#9cc4ff" stroke-opacity=".45" stroke-width="1.5">
      <path d="M60 150L130 110M60 150L130 190M60 150L130 270M60 250L130 110M60 250L130 190M60 250L130 270M60 250L130 350M60 350L130 190M60 350L130 270M60 350L130 350M60 350L130 430M60 450L130 350M60 450L130 430M60 450L130 270"/>
      <path d="M130 110L210 250M130 190L210 250M130 270L210 250M130 190L210 290M130 270L210 290M130 350L210 290M130 270L210 330M130 350L210 330M130 430L210 330"/>
    </g>
    <g fill="#e8f1ff" stroke="#6ea8ff" stroke-width="2">
      <circle cx="60" cy="150" r="11"/><circle cx="60" cy="250" r="11"/><circle cx="60" cy="350" r="11"/><circle cx="60" cy="450" r="11"/>
      <circle cx="130" cy="110" r="11"/><circle cx="130" cy="190" r="11"/><circle cx="130" cy="270" r="11"/><circle cx="130" cy="350" r="11"/><circle cx="130" cy="430" r="11"/>
    </g>
    <g fill="#ffd166" stroke="#fff" stroke-width="2"><circle cx="210" cy="250" r="9"/><circle cx="210" cy="290" r="9"/><circle cx="210" cy="330" r="9"/></g>
  </g>

  <!-- FPGA chip (centre) -->
  <g>
    <g stroke="#cfd8ee" stroke-width="5" stroke-linecap="round">
      <path d="M330 170v22M360 170v22M390 170v22M420 170v22M450 170v22M480 170v22"/>
      <path d="M330 388v22M360 388v22M390 388v22M420 388v22M450 388v22M480 388v22"/>
      <path d="M278 215h22M278 245h22M278 275h22M278 305h22M278 335h22M278 365h22"/>
      <path d="M512 215h22M512 245h22M512 275h22M512 305h22M512 335h22M512 365h22"/>
    </g>
    <rect x="300" y="192" width="212" height="196" rx="16" fill="url(#chip)" stroke="#7fb0ff" stroke-width="3"/>
    <g fill="none" stroke="#7fb0ff" stroke-opacity=".55" stroke-width="2">
      <rect x="324" y="216" width="164" height="148" rx="8"/>
      <path d="M324 266h164M324 316h164M379 216v148M434 216v148"/>
    </g>
    <g fill="#6ea8ff"><rect x="338" y="230" width="26" height="22" rx="4"/><rect x="448" y="280" width="26" height="22" rx="4"/><rect x="393" y="330" width="26" height="22" rx="4"/><rect x="338" y="280" width="26" height="22" rx="4" opacity=".5"/><rect x="448" y="230" width="26" height="22" rx="4" opacity=".5"/></g>
    <text x="406" y="297" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" fill="#fff" stroke="#101a3a" stroke-width="5" paint-order="stroke">FPGA</text>
  </g>

  <!-- vision frame (top right) -->
  <g>
    <rect x="560" y="60" width="200" height="130" rx="12" fill="#0c1633" stroke="#9cc4ff" stroke-width="2"/>
    <path d="M572 170l36-44 26 30 24-20 56 34z" fill="#27407a"/>
    <circle cx="718" cy="92" r="12" fill="#ffd166"/>
    <rect x="596" y="108" width="62" height="50" rx="3" fill="none" stroke="#5be3a8" stroke-width="3"/>
    <rect x="596" y="94" width="38" height="14" rx="3" fill="#5be3a8"/>
    <rect x="676" y="124" width="52" height="40" rx="3" fill="none" stroke="#ff7a90" stroke-width="3"/>
    <rect x="676" y="110" width="32" height="14" rx="3" fill="#ff7a90"/>
    <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M570 76v-8h8M750 76v-8h-8M570 182v8h8M750 182v8h-8"/></g>
  </g>

  <!-- drone (bottom right) -->
  <g transform="translate(660 400)">
    <g stroke="#e8f1ff" stroke-width="5" stroke-linecap="round"><path d="M-70 -26L-20 -4M70 -26L20 -4M-70 40L-20 14M70 40L20 14"/></g>
    <g fill="#e8f1ff" fill-opacity=".85"><ellipse cx="-70" cy="-30" rx="34" ry="6"/><ellipse cx="70" cy="-30" rx="34" ry="6"/><ellipse cx="-70" cy="36" rx="34" ry="6"/><ellipse cx="70" cy="36" rx="34" ry="6"/></g>
    <g fill="#e8f1ff"><circle cx="-70" cy="-26" r="6"/><circle cx="70" cy="-26" r="6"/><circle cx="-70" cy="40" r="6"/><circle cx="70" cy="40" r="6"/></g>
    <rect x="-30" y="-14" width="60" height="38" rx="14" fill="#1a2750" stroke="#e8f1ff" stroke-width="3"/>
    <circle cx="0" cy="26" r="11" fill="#0c1633" stroke="#ffd166" stroke-width="3"/><circle cx="0" cy="26" r="4" fill="#ffd166"/>
    <path d="M0 40L-26 86M0 40L26 86" stroke="#ffd166" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5"/>
  </g>

  <!-- labels -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#fff">
    <text x="60" y="508">Machine Learning</text>
    <text x="318" y="508">Hardware Acceleration</text>
    <text x="606" y="508">Vision &amp; UAVs</text>
  </g>
</svg>
